<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>GlassDesk</title>
    <link rel="icon" type="image/png" href="/icons/icon-32.png" />
    <style>
      #boot-static {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: grid;
        place-items: center;
        background:
          radial-gradient(125% 105% at 86% -12%, #ffc7a4 0%, rgba(255, 199, 164, 0) 54%),
          radial-gradient(115% 100% at -6% 104%, #b9cff4 0%, rgba(185, 207, 244, 0) 56%),
          linear-gradient(152deg, #eef2fb 0%, #dfe7f5 52%, #e5eaf5 100%);
        font-family: "Segoe UI Variable Display", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", system-ui, sans-serif;
        transition: opacity 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      #boot-static.is-leaving { opacity: 0; pointer-events: none; }
      .boot-static__inner { display: flex; align-items: center; flex-direction: column; gap: 11px; }
      .boot-static__inner img { border-radius: 15px; box-shadow: 0 18px 34px -22px rgb(46 58 84 / 45%); }
      .boot-static__title { color: #252832; font-size: 14px; font-weight: 620; letter-spacing: 0.01em; }
      .boot-static__line { width: 120px; height: 3px; border-radius: 999px; background: rgb(255 255 255 / 42%); overflow: hidden; }
      .boot-static__line::after {
        content: ""; display: block; width: 48%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, rgb(255 255 255 / 92%), transparent);
        animation: boot-shimmer 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .boot-static__hint { color: #6d7484; font-size: 10.5px; }
      @keyframes boot-shimmer { from { transform: translateX(-120%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) { .boot-static__line::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-static" role="status" aria-live="polite">
      <div class="boot-static__inner">
        <img src="/icons/icon-128.png" alt="" width="54" height="54" />
        <div class="boot-static__title">GlassDesk</div>
        <div class="boot-static__line" aria-hidden="true"></div>
        <div class="boot-static__hint">正在摆好桌面</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/newtab/main.tsx"></script>
  </body>
</html>
